name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Sintaxe e checagens basicas (F/E9)
        run: |
          python -m py_compile models/*.py schemas.py server.py
          python -m ruff check --select F,E9 models schemas.py server.py _launch_test_server.py tests

      - name: Testes de unidade (models) com gate de cobertura
        run: |
          python -m pytest tests/test_models_unit.py tests/test_corpus.py -q \
            --cov=models --cov-report=term-missing --cov-fail-under=70

      - name: Baterias funcionais de integracao (servidor MCP isolado)
        run: |
          python -m pytest tests/test_baterias_ci.py -q -m integracao
