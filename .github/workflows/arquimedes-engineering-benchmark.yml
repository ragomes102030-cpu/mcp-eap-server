name: Arquimedes Engineering Benchmark — eap
on:
  push:
    branches: [audit/engineering-benchmark-p2-20261030, master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engineering-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MCP_TARGET: eap
      MCP_PUBLIC_ALLOWED_ORIGINS: https://independent-client.example
      VERCEL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen domain and test dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install 'pytest-timeout==2.3.1' httpx
          python -m pip check
      - name: Validate syntax
        run: python -m compileall -q .
      - name: Isolated real MCP transport (both protocols)
        run: timeout 95s python -m pytest tests/test_public_mcp_dual_protocol.py -q --junitxml=artifacts/protocol.xml
      - name: All EAP and benchmark tests (isolated SQLite)
        run: python -m pytest tests/ --ignore=tests/test_public_mcp_dual_protocol.py -q --maxfail=1 --timeout=90 --timeout-method=thread --junitxml=artifacts/engineering.xml
      - name: Summarize engineering results without inventing missing cases
        if: always()
        run: |
          python scripts/benchmark_report.py artifacts/engineering.xml artifacts/engineering-report.json
          if [ -f artifacts/protocol.xml ]; then python scripts/benchmark_report.py artifacts/protocol.xml artifacts/transport-report.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arquimedes-engineering-benchmark-eap
          path: artifacts/
          if-no-files-found: warn
