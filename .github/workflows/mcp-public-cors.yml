name: MCP public CORS security isolated (eap)
on:
  push:
    branches: [feat/mcp2-dual-protocol-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cors-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL: "0"
      MCP_PUBLIC_ALLOWED_ORIGINS: https://independent-client.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server and test requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify CORS and private endpoint isolation without another full suite
        run: timeout 45s python -m pytest tests/test_public_mcp_cors.py -q -s
